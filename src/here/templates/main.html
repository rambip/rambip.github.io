<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ name }}</title>
        <link rel="stylesheet" href="/assets/style.css" />
        <link rel="stylesheet" href="/assets/code_highlighting.css" />
        <!--add the marimo-tex element for math support.-->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
        <script>
            class MarimoTex extends HTMLElement {
                connectedCallback() {
                    // Wait for content to be available
                    setTimeout(() => {
                        const latex = this.textContent.slice(3, -3);
                        if (!latex) return;

                        this.innerHTML = "";
                        katex.render(latex, this, {
                            throwOnError: false,
                            displayMode: this.hasAttribute("display"),
                        });
                    }, 0);
                }
            }

            customElements.define("marimo-tex", MarimoTex);
        </script>
        <style>
            .download-button {
                background-color: #35765e;
                border: none;
                color: white;
                padding: 10px 20px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                margin: 10px 0;
                cursor: pointer;
                border-radius: 4px;
            }
        </style>
    </head>
    <body id="root">
        <nav>
            <a href="{{ home_page_url }}">Home</a>
        </nav>
        <div class="content">
            <script id="file-content" type="text/plain">
                {{ python_content_encoded }}
            </script>
            <button class="download-button" onclick="downloadFile()">
                Download {{ python_filename }} locally
            </button>
            <script>
                function downloadFile() {
                    const base64Content = document
                        .getElementById("file-content")
                        .textContent.trim();
                    const content = atob(base64Content);
                    const blob = new Blob([content], { type: "text/plain" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "{{ python_filename }}";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
            </script>
            {% for code_block, output in content %} {%if code_block%} {{
            code_block }} {%if output %}
            <div class="cell-output">{{ output }}</div>
            {%endif %} {%else %} {%if output %}
            <div>{{ output }}</div>
            {%endif %} {%endif %} {% endfor %}
        </div>
    </body>
</html>
